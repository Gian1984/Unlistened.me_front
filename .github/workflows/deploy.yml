name: Build and Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd

      - name: Generate OG Images
        run: php scripts/generate-og-images.php

      - name: Generate Site (Nuxt)
        run: npx nuxi generate
        env:
          NUXT_PUBLIC_API_BASE_URL: ${{ secrets.VITE_BASE_URL }}

      - name: Post-generation assets copy
        run: |
          cp public/.htaccess .output/public/.htaccess 2>/dev/null || echo "htaccess already in output"
          cp public/robots.txt .output/public/ 2>/dev/null || echo "no robots.txt"


      - name: Verify .htaccess in output
        run: |
          cat .output/public/.htaccess
          echo "✓ .htaccess present in .output/public/"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          security: loose
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
